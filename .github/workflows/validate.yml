name: Validate

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate package and scripts
        run: |
          chmod +x install uninstall test bin/completion-notify scripts/validate-pack
          ./test
